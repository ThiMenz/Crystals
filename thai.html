<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai RTGS Lernen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: bold;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
        }

        .learning-card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            font-weight: bold;
            text-align: center;
        }

        td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s ease;
        }

        td:first-child {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        #vowels-table td:nth-child(2) {
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }

        tr:hover td {
            background-color: #f8f9ff;
        }

        .quiz-section {
            display: none;
        }

        .quiz-section.active {
            display: block;
        }

        .quiz-card {
            text-align: center;
            padding: 40px;
        }

        .thai-character {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .quiz-option {
            background: #f8f9ff;
            border: 2px solid #e1e8ff;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .quiz-option:hover {
            background: #e1e8ff;
            transform: translateY(-2px);
        }

        .quiz-option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .quiz-option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .score {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .next-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .flashcard-section {
            display: none;
        }

        .flashcard-section.active {
            display: block;
        }

        .flashcard {
            background: white;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            height: 300px;
            position: relative;
            margin-bottom: 20px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
        }

        .flashcard-back {
            transform: rotateY(180deg);
            background: #f8f9ff;
        }

        .flashcard-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .control-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .control-btn.shuffle {
            background: #28a745;
        }

        .control-btn.shuffle:hover {
            background: #218838;
        }

        .quiz-settings {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .quiz-settings label {
            color: white;
            font-weight: bold;
            margin-right: 10px;
        }

        .quiz-settings select {
            background: white;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 8px 15px;
            font-size: 1rem;
            color: #333;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .mode-selector {
                flex-direction: column;
                align-items: center;
            }
            
            .thai-character {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇹🇭 Thai RTGS Lernen</h1>
            <p>Die standardisierte Romanisierung von Thai</p>
        </div>

        <div class="mode-selector">
            <button class="mode-btn active" onclick="showMode('reference')">📚 Referenz</button>
            <button class="mode-btn" onclick="showMode('quiz')">🎯 Quiz</button>
            <button class="mode-btn" onclick="showMode('flashcards')">🃏 Karteikarten</button>
        </div>

        <!-- Reference Mode -->
        <div id="reference-mode" class="mode-section">
            <div class="learning-card">
                <h2 style="text-align: center; margin-bottom: 20px; color: #667eea;">Konsonanten</h2>
                <div class="table-container">
                    <table id="consonants-table">
                        <thead>
                            <tr>
                                <th>Thai Buchstaben</th>
                                <th>Silbenanfang</th>
                                <th>Silbenende</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="learning-card">
                <h2 style="text-align: center; margin-bottom: 20px; color: #667eea;">Vokale und Diakritische Zeichen</h2>
                <div class="table-container">
                    <table id="vowels-table">
                        <thead>
                            <tr>
                                <th>Silbenkern</th>
                                <th>Silbenende</th>
                                <th>RTGS Umschrift</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Quiz Mode -->
        <div id="quiz-mode" class="mode-section quiz-section">
            <div class="quiz-settings">
                <label for="quiz-options-count">Anzahl Antwortmöglichkeiten:</label>
                <select id="quiz-options-count">
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4" selected>4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="8">8</option>
                </select>
            </div>
            <div class="learning-card">
                <div class="score">
                    <span id="quiz-score">Punkte: 0/0</span>
                </div>
                <div class="quiz-card">
                    <div class="thai-character" id="quiz-character"></div>
                    <p id="quiz-question"></p>
                    <div class="quiz-options" id="quiz-options"></div>
                    <button class="next-btn" id="next-question" onclick="nextQuestion()" style="display: none;">Nächste Frage</button>
                </div>
            </div>
        </div>

        <!-- Flashcards Mode -->
        <div id="flashcards-mode" class="mode-section flashcard-section">
            <div class="learning-card">
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <div class="flashcard-front">
                        <div class="thai-character" id="flashcard-character"></div>
                    </div>
                    <div class="flashcard-back">
                        <div style="font-size: 1.5rem; color: #667eea;" id="flashcard-romanization"></div>
                        <div style="margin-top: 10px; color: #666;" id="flashcard-position"></div>
                    </div>
                </div>
                <div class="flashcard-controls">
                    <button class="control-btn" onclick="previousCard()">← Vorherige</button>
                    <button class="control-btn" onclick="flipCard()">Umdrehen</button>
                    <button class="control-btn shuffle" onclick="shuffleCards()">🔀 Mischen</button>
                    <button class="control-btn" onclick="nextCard()">Nächste →</button>
                </div>
                <div style="text-align: center; margin-top: 10px; color: white;">
                    <span id="card-counter">1 / 1</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data from the HTML tables
        const consonants = [
            {thai: 'ก', start: 'k', end: 'k'},
            {thai: 'ข, ฃ, ค, ฅ, ฆ', start: 'kh', end: 'k'},
            {thai: 'ง', start: 'ng', end: 'ng'},
            {thai: 'จ, ฉ, ช, ฌ', start: 'ch', end: 't'},
            {thai: 'ซ, ศ, ษ, ส', start: 's', end: 't'},
            {thai: 'ญ', start: 'y', end: 'n'},
            {thai: 'ฎ, ด, ฑ', start: 'd', end: 't'},
            {thai: 'ฏ, ต', start: 't', end: 't'},
            {thai: 'ฐ, ฑ, ฒ, ถ, ท, ธ', start: 'th', end: 't'},
            {thai: 'ณ, น', start: 'n', end: 'n'},
            {thai: 'บ', start: 'b', end: 'p'},
            {thai: 'ป', start: 'p', end: 'p'},
            {thai: 'ผ, พ, ภ', start: 'ph', end: 'p'},
            {thai: 'ฝ, ฟ', start: 'f', end: 'p'},
            {thai: 'ม', start: 'm', end: 'm'},
            {thai: 'ย', start: 'y', end: ''},
            {thai: 'ร', start: 'r', end: 'n'},
            {thai: 'ฤ', start: 'ri', end: ''},
            {thai: 'ฤ, ฤๅ', start: 'rue', end: ''},
            {thai: 'ฤ', start: 'roe', end: ''},
            {thai: 'ล, ฬ', start: 'l', end: 'n'},
            {thai: 'ฦ, ฦๅ', start: 'lue', end: ''},
            {thai: 'ว', start: 'w', end: ''},
            {thai: 'ห, ฮ', start: 'h', end: ''},
            {thai: 'อ', start: '', end: ''}
        ];

        const vowels = [
            {core: '–ั –, –า –, –รร–', end: '–, –ะ, –า', rtgs: 'a'},
            {core: '', end: '–รร', rtgs: 'an'},
            {core: '', end: '–ำ', rtgs: 'am'},
            {core: '–ิ –, –ี –', end: '–ิ, –ี', rtgs: 'i'},
            {core: '–ึ –, –ื –', end: '–ึ, –ือ', rtgs: 'ue'},
            {core: '–ุ –, –ู –', end: '–ุ, –ู', rtgs: 'u'},
            {core: 'เ–็ –, เ– –', end: 'เ–ะ, เ–', rtgs: 'e'},
            {core: 'แ–็ –, แ– –', end: 'แ–ะ, แ–', rtgs: 'ae'},
            {core: 'เ–ิ –', end: 'เ–อะ, เ–อ', rtgs: 'oe'},
            {core: '– –, โ– –, –อ–', end: 'โ–ะ, โ–, เ–าะ, –อ', rtgs: 'o'},
            {core: '', end: '–ร', rtgs: 'on'},
            {core: '', end: 'ใ–, ไ–, ไ–ย, –ัย, –าย', rtgs: 'ai'},
            {core: '', end: 'เ–า, –าว', rtgs: 'ao'},
            {core: 'เ–ีย–', end: 'เ–ียะ, เ–ีย', rtgs: 'ia'},
            {core: 'เ–ือ–', end: 'เ–ือะ, เ–ือ', rtgs: 'uea'},
            {core: '–ว–', end: '–ัวะ, –ัว', rtgs: 'ua'},
            {core: '', end: '–ิว', rtgs: 'io'},
            {core: '', end: '–ุย', rtgs: 'ui'},
            {core: '', end: 'เ–็ว, เ–ว', rtgs: 'eo'},
            {core: '', end: 'แ–็ว, แ–ว', rtgs: 'aeo'},
            {core: '', end: 'เ–ย', rtgs: 'oei'},
            {core: '', end: 'โ–ย, –อย', rtgs: 'oi'},
            {core: '', end: 'เ–ียว', rtgs: 'iao'},
            {core: '', end: 'เ–ือย', rtgs: 'ueai'},
            {core: '', end: '–วย', rtgs: 'uai'}
        ];

        // Current state
        let currentMode = 'reference';
        let quizScore = 0;
        let quizTotal = 0;
        let currentQuizItem = null;
        let flashcardIndex = 0;
        let isFlipped = false;
        let flashcardOrder = []; // Array to store shuffled order

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            populateTables();
            showMode('reference');
        });

        function populateTables() {
            // Populate consonants table
            const consonantsTableBody = document.querySelector('#consonants-table tbody');
            consonants.forEach(item => {
                const row = consonantsTableBody.insertRow();
                row.insertCell(0).textContent = item.thai;
                row.insertCell(1).textContent = item.start;
                row.insertCell(2).textContent = item.end;
            });

            // Populate vowels table
            const vowelsTableBody = document.querySelector('#vowels-table tbody');
            vowels.forEach(item => {
                const row = vowelsTableBody.insertRow();
                row.insertCell(0).textContent = item.core;
                row.insertCell(1).textContent = item.end;
                row.insertCell(2).textContent = item.rtgs;
            });
        }

        function showMode(mode) {
            // Update active button
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Hide all mode sections
            document.querySelectorAll('.mode-section').forEach(section => {
                section.style.display = 'none';
                section.classList.remove('active');
            });

            // Show selected mode
            const modeSection = document.getElementById(mode + '-mode');
            modeSection.style.display = 'block';
            modeSection.classList.add('active');

            currentMode = mode;

            if (mode === 'quiz') {
                startQuiz();
            } else if (mode === 'flashcards') {
                startFlashcards();
            }
        }

        function startQuiz() {
            quizScore = 0;
            quizTotal = 0;
            updateQuizScore();
            nextQuestion();
        }

        function nextQuestion() {
            // Reset previous question state
            document.getElementById('next-question').style.display = 'none';
            document.querySelectorAll('.quiz-option').forEach(opt => {
                opt.classList.remove('correct', 'incorrect');
                opt.onclick = function() { selectAnswer(this); };
            });

            // Generate new question
            const allItems = [...consonants, ...vowels];
            currentQuizItem = allItems[Math.floor(Math.random() * allItems.length)];
            
            let character, correctAnswer, questionText;
            
            if (currentQuizItem.thai) {
                // Consonant question
                character = currentQuizItem.thai.split(',')[0].trim(); // Take first character if multiple
                const isStart = Math.random() > 0.5;
                correctAnswer = isStart ? currentQuizItem.start : currentQuizItem.end;
                questionText = `Wie wird "${character}" am ${isStart ? 'Silbenanfang' : 'Silbenende'} romanisiert?`;
            } else {
                // Vowel question
                character = currentQuizItem.rtgs;
                correctAnswer = currentQuizItem.rtgs;
                questionText = `Welche RTGS-Umschrift gehört zu diesen Thai-Zeichen?`;
                character = currentQuizItem.end.split(',')[0].trim();
            }

            document.getElementById('quiz-character').textContent = character;
            document.getElementById('quiz-question').textContent = questionText;

            // Generate options
            const options = generateQuizOptions(correctAnswer);
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'quiz-option';
                button.textContent = option;
                button.onclick = function() { selectAnswer(this); };
                if (option === correctAnswer) {
                    button.dataset.correct = 'true';
                }
                optionsContainer.appendChild(button);
            });
        }

        function generateQuizOptions(correctAnswer) {
            let allAnswers;
            
            // Determine if this is a consonant or vowel question
            const isConsonantQuestion = consonants.some(c => 
                c.start === correctAnswer || c.end === correctAnswer
            );
            
            if (isConsonantQuestion) {
                // For consonant questions, use only consonant romanizations
                allAnswers = [...new Set([
                    ...consonants.map(c => c.start).filter(s => s),
                    ...consonants.map(c => c.end).filter(s => s)
                ])];
            } else {
                // For vowel questions, use only vowel romanizations
                allAnswers = [...new Set(vowels.map(v => v.rtgs))];
            }
            
            const wrongAnswers = allAnswers.filter(answer => answer !== correctAnswer);
            
            // Get desired number of options from settings
            const desiredOptions = parseInt(document.getElementById('quiz-options-count').value);
            const maxPossibleOptions = Math.min(desiredOptions, wrongAnswers.length + 1); // +1 for correct answer
            const numberOfWrongAnswers = maxPossibleOptions - 1;
            
            const selectedWrong = wrongAnswers.sort(() => Math.random() - 0.5).slice(0, numberOfWrongAnswers);
            
            const options = [correctAnswer, ...selectedWrong];
            return options.sort(() => Math.random() - 0.5);
        }

        function selectAnswer(selectedOption) {
            quizTotal++;
            const isCorrect = selectedOption.dataset.correct === 'true';
            
            if (isCorrect) {
                quizScore++;
                selectedOption.classList.add('correct');
            } else {
                selectedOption.classList.add('incorrect');
                // Show correct answer
                document.querySelectorAll('.quiz-option').forEach(opt => {
                    if (opt.dataset.correct === 'true') {
                        opt.classList.add('correct');
                    }
                });
            }

            // Disable all options
            document.querySelectorAll('.quiz-option').forEach(opt => {
                opt.onclick = null;
            });

            updateQuizScore();
            document.getElementById('next-question').style.display = 'block';
        }

        function updateQuizScore() {
            document.getElementById('quiz-score').textContent = `Punkte: ${quizScore}/${quizTotal}`;
        }

        function startFlashcards() {
            flashcardIndex = 0;
            isFlipped = false;
            initializeFlashcardOrder();
            updateFlashcard();
        }

        function initializeFlashcardOrder() {
            // Create initial sequential order
            const consonantItems = consonants.filter(c => c.thai && c.start);
            const vowelItems = vowels.filter(v => v.end && v.rtgs);
            const totalItems = consonantItems.length + vowelItems.length;
            
            flashcardOrder = Array.from({length: totalItems}, (_, i) => i);
        }

        function shuffleCards() {
            // Shuffle the flashcard order
            for (let i = flashcardOrder.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [flashcardOrder[i], flashcardOrder[j]] = [flashcardOrder[j], flashcardOrder[i]];
            }
            
            // Reset to first card in new order
            flashcardIndex = 0;
            updateFlashcard();
        }

        function updateFlashcard() {
            // Combine consonants and vowels for flashcards
            const consonantItems = consonants.filter(c => c.thai && c.start).map(item => ({
                character: item.thai.split(',')[0].trim(),
                romanization: `Start: ${item.start}${item.end ? `, Ende: ${item.end}` : ''}`,
                position: `Silbenanfang: ${item.start}${item.end ? ` | Silbenende: ${item.end}` : ''}`,
                type: 'consonant'
            }));
            
            const vowelItems = vowels.filter(v => v.end && v.rtgs).map(item => ({
                character: item.end.split(',')[0].trim(),
                romanization: item.rtgs,
                position: `Vokal/Diakritisches Zeichen`,
                type: 'vowel'
            }));
            
            const allItems = [...consonantItems, ...vowelItems];
            
            // Use shuffled order
            const actualIndex = flashcardOrder[flashcardIndex % flashcardOrder.length];
            const item = allItems[actualIndex];
            
            document.getElementById('flashcard-character').textContent = item.character;
            document.getElementById('flashcard-romanization').textContent = item.romanization;
            document.getElementById('flashcard-position').textContent = item.position;
            document.getElementById('card-counter').textContent = `${flashcardIndex + 1} / ${allItems.length}`;
            
            // Reset flip state
            document.getElementById('flashcard').classList.remove('flipped');
            isFlipped = false;
        }

        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            flashcard.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }

        function nextCard() {
            flashcardIndex++;
            updateFlashcard();
        }

        function previousCard() {
            flashcardIndex = Math.max(0, flashcardIndex - 1);
            updateFlashcard();
        }
    </script>
</body>
</html>
